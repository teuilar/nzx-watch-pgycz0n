name: Refresh stock monitor

# Runs on weekdays at 07:00 UTC = 7pm NZ time (NZST) / 5pm Sydney (AEST).
# Both markets are closed by then. GitHub Actions cron is in UTC.
# Schedules can be delayed a few minutes during peak load — that's normal.
on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:        # lets you click "Run workflow" manually from the Actions tab

permissions:
  contents: write           # required so the action can commit the refreshed index.html

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      # Forces actions to run on Node.js 24, avoiding the Node 20 deprecation
      # taking effect June 2, 2026.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch latest prices
        run: python fetch_prices.py

      - name: Rebuild the dashboard
        run: python build_dashboard.py

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html prices.json
          if git diff --cached --quiet; then
            echo "No changes — markets must be quiet."
          else
            git commit -m "Daily refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
